<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161F"/>
      <stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#39D0D8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#9FB4C7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="600" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#8FA9C4" stroke-width="1">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M160 0v600M320 0v600M480 0v600M640 0v600M800 0v600M960 0v600M1120 0v600"/>
  </g>

  <!-- Logo and wordmark -->
  <g transform="translate(64 40) scale(0.6829)">
    <rect width="164" height="164" rx="38" fill="#151C27" stroke="#2C3648" stroke-width="2"/>
    <path d="M40 54 L68 77 L40 100" fill="none" stroke="url(#beam)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="60" width="44" height="9" rx="4.5" fill="#E6EDF3" opacity="0.9"/>
    <rect x="84" y="79" width="26" height="9" rx="4.5" fill="#3FB950" opacity="0.75"/>
    <rect x="84" y="98" width="54" height="9" rx="4.5" fill="#39D0D8" opacity="0.45"/>
    <circle cx="132" cy="38" r="8.5" fill="#D29922"/>
    <circle cx="132" cy="38" r="16" fill="none" stroke="#D29922" stroke-width="2.5" opacity="0.4"/>
  </g>

  <text x="200" y="118" font-family="system-ui, -apple-system, SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#word)">bashle</text>
  <text x="204" y="150" font-family="system-ui, -apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif"
        font-size="21" fill="#7D8FA3">A live programming environment for bash scripts — sandboxed.</text>

  <!-- Editor window -->
  <g transform="translate(64 196)">
    <rect width="1152" height="364" rx="16" fill="#0D1117" stroke="#222B3A" stroke-width="2"/>
    <circle cx="26" cy="22" r="5.5" fill="#FF5F57"/><circle cx="46" cy="22" r="5.5" fill="#FEBC2E"/><circle cx="66" cy="22" r="5.5" fill="#28C840"/>
    <text x="96" y="27" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" fill="#7D8FA3">release.sh</text>
    <line x1="0" y1="44" x2="1152" y2="44" stroke="#222B3A" stroke-width="2"/>
    <line x1="820" y1="44" x2="820" y2="312" stroke="#222B3A" stroke-width="2"/>
    <line x1="0" y1="312" x2="1152" y2="312" stroke="#222B3A" stroke-width="2"/>

    <!-- Source, with bashle's annotations at the end of each line -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16">
      <g fill="#3A4556" text-anchor="end">
        <text x="36" y="84">1</text><text x="36" y="118">2</text><text x="36" y="152">3</text>
        <text x="36" y="186">4</text><text x="36" y="220">5</text><text x="36" y="254">6</text>
        <text x="36" y="288">7</text>
      </g>

      <text x="56" y="84" fill="#5C6B7D"># <tspan fill="#39D0D8">@probe</tspan><tspan fill="#7D8FA3"> staging =&gt; exit 0</tspan></text>
      <text x="56" y="118" fill="#9FB4C7">version=$(curl -s "$api/latest")</text>
      <text x="56" y="152" fill="#9FB4C7">dest="releases/$1/$version"</text>
      <text x="56" y="186" fill="#9FB4C7">mkdir -p "$dest"</text>
      <text x="56" y="220" fill="#9FB4C7">for f in $files; do</text>
      <text x="56" y="254" fill="#9FB4C7">&#160;&#160;cp "$f" "$dest/"</text>
      <text x="56" y="288" fill="#9FB4C7">done</text>

      <g font-style="italic">
        <text x="400" y="84" fill="#F85149">✗ expected exit 0 · got exit 1</text>
        <text x="400" y="118" fill="#5C6B7D">version=<tspan fill="#D29922">◇1</tspan></text>
        <text x="400" y="152" fill="#5C6B7D">dest=releases/staging/<tspan fill="#D29922">◇1</tspan></text>
        <text x="400" y="186" fill="#5C6B7D">mkdir -p releases/staging/<tspan fill="#D29922">◇1</tspan></text>
        <text x="400" y="220" fill="#5C6B7D">f=<tspan fill="#7D8FA3">my · report.txt</tspan></text>
        <text x="400" y="254" fill="#F85149">cp report.txt releases/staging/◇1/&#160;&#160;✗1</text>
      </g>
    </g>

    <!-- Side panel: the open hole, and what the failing lines said -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace">
      <text x="844" y="82" font-size="11.5" letter-spacing="1.5" fill="#5C6B7D">HOLES<tspan fill="#D29922">&#160;&#160;1 open</tspan></text>
      <text x="844" y="110" font-size="13" fill="#9FB4C7"><tspan fill="#D29922">◇1</tspan>&#160;&#160;GET …/latest</text>
      <text x="844" y="132" font-size="13" fill="#5C6B7D">&#160;&#160;&#160;&#160;reaches version, dest</text>
      <text x="844" y="154" font-size="13" fill="#5C6B7D">&#160;&#160;&#160;&#160;fill&#160;&#160;<tspan fill="#7D8FA3"># @net GET … =&gt; ""</tspan></text>

      <text x="844" y="204" font-size="11.5" letter-spacing="1.5" fill="#5C6B7D">STDERR</text>
      <text x="844" y="232" font-size="13" fill="#C9605A">cp: my: No such file or directory</text>
      <text x="844" y="254" font-size="13" fill="#C9605A">cp: report.txt: No such file or…</text>
    </g>

    <!-- Status line -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="15">
      <text x="26" y="343" fill="#D29922">⛨ sandboxed</text>
      <text x="150" y="343" fill="#5C6B7D">network denied · writes outside a throwaway clone blocked · 0 files changed on your machine</text>
    </g>
  </g>
</svg>
