<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" width="1280" height="1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161F"/>
      <stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#39D0D8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#9FB4C7"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 420)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <g opacity="0.05" stroke="#8FA9C4" stroke-width="1">
      <path d="M0 110h1280M0 220h1280M0 330h1280M160 0v440M320 0v440M480 0v440M640 0v440M800 0v440M960 0v440M1120 0v440"/>
    </g>

    <g transform="translate(62 138)">
      <rect width="164" height="164" rx="38" fill="#151C27" stroke="#2C3648" stroke-width="2"/>
      <path d="M40 54 L68 77 L40 100" fill="none" stroke="url(#beam)" stroke-width="12"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="84" y="60" width="44" height="9" rx="4.5" fill="#E6EDF3" opacity="0.9"/>
      <rect x="84" y="79" width="26" height="9" rx="4.5" fill="#3FB950" opacity="0.75"/>
      <rect x="84" y="98" width="54" height="9" rx="4.5" fill="#39D0D8" opacity="0.45"/>
      <circle cx="132" cy="38" r="8.5" fill="#D29922"/>
      <circle cx="132" cy="38" r="16" fill="none" stroke="#D29922" stroke-width="2.5" opacity="0.4"/>
    </g>

    <text x="258" y="206" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif"
          font-size="86" font-weight="700" letter-spacing="-3" fill="url(#word)">bashle</text>
    <text x="262" y="252" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="22" fill="#7D8FA3">A live programming environment</text>
    <text x="262" y="284" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="22" fill="#7D8FA3">for bash scripts — sandboxed.</text>

    <g transform="translate(668 96)" font-family="SF Mono, Menlo, monospace" font-size="18">
      <rect x="-22" y="-32" width="590" height="278" rx="16" fill="#0D1117" stroke="#222B3A" stroke-width="2"/>
      <circle cx="2" cy="-12" r="5.5" fill="#FF5F57"/><circle cx="22" cy="-12" r="5.5" fill="#FEBC2E"/><circle cx="42" cy="-12" r="5.5" fill="#28C840"/>

      <text x="0" y="34" fill="#9FB4C7">dest=</text>
      <text x="238" y="34" fill="#5C6B7D" font-style="italic">dest=''</text>

      <text x="0" y="74" fill="#9FB4C7">for f in $files; do</text>
      <text x="238" y="74" fill="#5C6B7D" font-style="italic">×3  f='my report.txt'</text>

      <text x="20" y="114" fill="#9FB4C7">cp "$f" "$dest/"</text>
      <text x="238" y="114" fill="#F85149" font-style="italic">cp 'my report.txt' '/'  ✗1</text>

      <text x="0" y="154" fill="#9FB4C7">done</text>

      <line x1="0" y1="180" x2="546" y2="180" stroke="#222B3A" stroke-width="2"/>
      <text x="0" y="212" fill="#D29922" font-size="17">⛨ sandboxed</text>
      <text x="126" y="212" fill="#5C6B7D" font-size="17">0 files changed on your machine</text>
    </g>
  </g>
</svg>
